<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1512 581" width="1512" height="581" role="img" aria-label="A playground chat" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif">
<title>A playground chat</title>
<desc>One Vercel deployment: a React SPA (and its branded microsites) talks to an Express API running as a serverless function. Express resolves the site, enforces CSRF, JWT and rate limits, then reaches Supabase for data, OpenRouter for AI and Mailgun for email. Every OpenRouter key stays on the server.</desc>
